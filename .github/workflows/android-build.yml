name: Android CI

# Builds a debug APK that can be downloaded from the run's Artifacts section.
#
# Expo is not applicable here: this is a native Android (Kotlin + Jetpack Compose)
# application, not a React Native / JavaScript project. The only realistic way to
# produce an installable build without a local Android SDK is this CI pipeline.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # A debug keystore is generated per runner, so every CI run used to produce an APK with a
      # different signature. Android then refuses in-place updates (INSTALL_FAILED_UPDATE_INCOMPATIBLE)
      # and testing on a device meant losing app data on every build.
      #
      # Seeding the runner's standard debug keystore from the DEBUG_KEYSTORE_BASE64 secret makes CI
      # use the very same key as a local Android Studio build. Without the secret the step is a no-op
      # and AGP falls back to generating an ephemeral keystore, so forks still build fine.
      - name: Seed stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 is not set - AGP will generate an ephemeral debug keystore."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Seeded the shared debug keystore; the APK signature will match local builds."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties (wrapper jar is not committed).
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      # Makes the APK signature visible in the log, which is how you confirm the shared debug
      # keystore was picked up (the SHA-256 must match your local ~/.android/debug.keystore).
      - name: Report APK signing certificate
        continue-on-error: true
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -E "certificate SHA-256 digest|Verified using"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioDetective-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Unit tests are reported separately and must not block the APK artifact.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AudioDetective-unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
