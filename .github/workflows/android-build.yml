name: Android CI

# Builds a debug APK that can be downloaded from the run's Artifacts section.
#
# Expo is not applicable here: this is a native Android (Kotlin + Jetpack Compose)
# application, not a React Native / JavaScript project. The only realistic way to
# produce an installable build without a local Android SDK is this CI pipeline.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # The debug APK is signed with app/debug.keystore, which is committed on purpose so that
      # local builds and CI share one key and APKs can be installed over each other.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties (wrapper jar is not committed).
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      # Makes the APK signature visible in the log, which is how you confirm the committed
      # shared debug keystore (app/debug.keystore) was used. Expected SHA-256:
      # 2b0806347966 5f3a8ae3 434d7554 2734e9b8 22718742 c4421c2d b623996d 9f10
      - name: Report APK signing certificate
        continue-on-error: true
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -E "certificate SHA-256 digest|Verified using"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioDetective-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Unit tests are reported separately and must not block the APK artifact.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AudioDetective-unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
